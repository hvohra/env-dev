apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cicd-lab
resources:
  - namespace.yaml
  - helmrelease.yaml
# Turns values/svc-hello.yaml into the ConfigMap the HelmRelease reads. No name
# hash, so the reference in helmrelease.yaml stays valid; helm-controller watches
# the ConfigMap and upgrades the release when its contents change.
configMapGenerator:
  - name: svc-hello-values
    files:
      - svc-hello.yaml=values/svc-hello.yaml
generatorOptions:
  disableNameSuffixHash: true
