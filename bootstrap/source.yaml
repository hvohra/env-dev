# Applied once by hand: `kubectl apply -f bootstrap/`. Everything else is pulled.
# Public repo over HTTPS: the cluster holds no token and cannot write back.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: env-dev
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/hvohra/env-dev
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: env-dev
  namespace: flux-system
spec:
  interval: 1m
  path: ./
  prune: true
  sourceRef:
    kind: GitRepository
    name: env-dev
